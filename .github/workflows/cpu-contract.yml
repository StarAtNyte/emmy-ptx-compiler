name: CPU compiler contract

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  compiler-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.lock
      - name: Install pinned CPU runtime
        run: |
          python -m pip install -r requirements.txt -c requirements-ci.lock
          python -m pip check
      - name: Check isolated CLI and committed PTX snapshots without Torch
        run: python tools/check_cpu_contract.py --forbid-torch --report artifacts/cpu-contract-result.json
      - name: Retain contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-contract-python-${{ matrix.python-version }}
          path: artifacts/cpu-contract-result.json
          if-no-files-found: warn
          retention-days: 14
